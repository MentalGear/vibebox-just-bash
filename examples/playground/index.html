<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>just-bash Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e94560;
    }

    header p {
      color: #888;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    #terminal-container {
      flex: 1;
      background: #0f0f23;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }

    #terminal {
      height: 100%;
      padding: 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      font-size: 0.85rem;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .status-dot.ready {
      background: #4caf50;
    }

    .status-dot.busy {
      background: #ff9800;
    }

    .help-text {
      color: #666;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.75rem 1rem;
      }

      main {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>just-bash Playground</h1>
    <p>A bash interpreter running entirely in your browser via Web Worker</p>
  </header>

  <main>
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
  </main>

  <div class="status-bar">
    <div class="status-indicator">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Initializing...</span>
    </div>
    <div class="help-text">Type "help" for available commands</div>
  </div>

  <script type="module">
    import { Terminal } from 'https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm';
    import { FitAddon } from 'https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm';

    // Initialize terminal
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      fontFamily: 'Menlo, Monaco, "Courier New", monospace',
      theme: {
        background: '#0f0f23',
        foreground: '#cccccc',
        cursor: '#e94560',
        cursorAccent: '#0f0f23',
        selectionBackground: '#3d3d5c',
        black: '#1a1a2e',
        red: '#e94560',
        green: '#4caf50',
        yellow: '#ff9800',
        blue: '#2196f3',
        magenta: '#9c27b0',
        cyan: '#00bcd4',
        white: '#eee',
        brightBlack: '#666',
        brightRed: '#ff6b6b',
        brightGreen: '#69f0ae',
        brightYellow: '#ffca28',
        brightBlue: '#64b5f6',
        brightMagenta: '#ce93d8',
        brightCyan: '#4dd0e1',
        brightWhite: '#fff',
      },
    });

    const fitAddon = new FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    // Handle window resize
    window.addEventListener('resize', () => fitAddon.fit());

    // Worker and state management
    const worker = new Worker('./dist/worker.js', { type: 'module' });
    let commandBuffer = '';
    let historyIndex = -1;
    let commandHistory = [];
    let currentLine = '';
    let isReady = false;
    let pendingCallbacks = new Map();
    let callbackId = 0;

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function setStatus(status, text) {
      statusDot.className = 'status-dot ' + status;
      statusText.textContent = text;
    }

    // Send command to worker and get result
    function execCommand(command) {
      return new Promise((resolve) => {
        const id = String(callbackId++);
        pendingCallbacks.set(id, resolve);
        worker.postMessage({ type: 'exec', id, command });
      });
    }

    // Handle worker messages
    worker.onmessage = (event) => {
      const msg = event.data;

      switch (msg.type) {
        case 'ready':
          isReady = true;
          setStatus('ready', 'Ready');
          term.writeln('\x1b[1;32mjust-bash\x1b[0m v1.0 - A bash interpreter in your browser');
          term.writeln('Type \x1b[1;36mhelp\x1b[0m for available commands, or try:');
          term.writeln('  \x1b[33mcat README.txt\x1b[0m    - View welcome message');
          term.writeln('  \x1b[33mls -la\x1b[0m           - List files');
          term.writeln('  \x1b[33mjq . example.json\x1b[0m - Parse JSON');
          term.writeln('');
          prompt();
          break;

        case 'result':
          if (pendingCallbacks.has(msg.id)) {
            pendingCallbacks.get(msg.id)(msg);
            pendingCallbacks.delete(msg.id);
          }
          break;

        case 'clear':
          term.clear();
          break;

        case 'error':
          if (msg.id && pendingCallbacks.has(msg.id)) {
            pendingCallbacks.get(msg.id)({ stdout: '', stderr: msg.message, exitCode: 1 });
            pendingCallbacks.delete(msg.id);
          } else {
            term.writeln('\x1b[31mError: ' + msg.message + '\x1b[0m');
          }
          break;
      }
    };

    worker.onerror = (error) => {
      setStatus('', 'Error');
      term.writeln('\x1b[31mWorker error: ' + error.message + '\x1b[0m');
    };

    // Write prompt
    function prompt() {
      term.write('\x1b[1;32m$\x1b[0m ');
    }

    // Process command
    async function processCommand(cmd) {
      const trimmed = cmd.trim();

      if (!trimmed) {
        prompt();
        return;
      }

      // Add to history
      if (commandHistory[commandHistory.length - 1] !== trimmed) {
        commandHistory.push(trimmed);
      }
      historyIndex = commandHistory.length;

      // Handle built-in help command
      if (trimmed === 'help') {
        term.writeln('\x1b[1;36mAvailable Commands:\x1b[0m');
        term.writeln('');
        term.writeln('\x1b[1mFile Operations:\x1b[0m');
        term.writeln('  ls, cat, head, tail, cp, mv, rm, mkdir, touch, find, tree');
        term.writeln('');
        term.writeln('\x1b[1mText Processing:\x1b[0m');
        term.writeln('  grep, sed, awk, sort, uniq, wc, cut, tr, paste, column');
        term.writeln('');
        term.writeln('\x1b[1mData Formats:\x1b[0m');
        term.writeln('  jq (JSON), base64, md5sum, sha256sum');
        term.writeln('');
        term.writeln('\x1b[1mShell:\x1b[0m');
        term.writeln('  echo, printf, env, export, pwd, cd, history, clear');
        term.writeln('');
        term.writeln('\x1b[1mExamples:\x1b[0m');
        term.writeln('  echo "Hello World"');
        term.writeln('  cat data.txt | sort | uniq');
        term.writeln('  jq ".features[]" example.json');
        term.writeln('  for i in 1 2 3; do echo $i; done');
        term.writeln('');
        prompt();
        return;
      }

      // Handle history command
      if (trimmed === 'history') {
        commandHistory.forEach((cmd, i) => {
          term.writeln(`  ${i + 1}  ${cmd}`);
        });
        prompt();
        return;
      }

      setStatus('busy', 'Running...');

      try {
        const result = await execCommand(trimmed);

        // Write stdout (handle colors)
        if (result.stdout) {
          // Write each line separately to handle proper line endings
          const lines = result.stdout.split('\n');
          for (let i = 0; i < lines.length; i++) {
            if (i < lines.length - 1 || lines[i]) {
              term.writeln(lines[i]);
            }
          }
        }

        // Write stderr in red
        if (result.stderr) {
          const lines = result.stderr.split('\n');
          for (let i = 0; i < lines.length; i++) {
            if (i < lines.length - 1 || lines[i]) {
              term.writeln('\x1b[31m' + lines[i] + '\x1b[0m');
            }
          }
        }
      } catch (err) {
        term.writeln('\x1b[31mError: ' + err.message + '\x1b[0m');
      }

      setStatus('ready', 'Ready');
      prompt();
    }

    // Handle terminal input
    term.onData((data) => {
      if (!isReady) return;

      const code = data.charCodeAt(0);

      // Enter key
      if (data === '\r') {
        term.writeln('');
        processCommand(commandBuffer);
        commandBuffer = '';
        currentLine = '';
        return;
      }

      // Backspace
      if (data === '\x7f') {
        if (commandBuffer.length > 0) {
          commandBuffer = commandBuffer.slice(0, -1);
          term.write('\b \b');
        }
        return;
      }

      // Ctrl+C
      if (data === '\x03') {
        term.writeln('^C');
        commandBuffer = '';
        prompt();
        return;
      }

      // Ctrl+L (clear)
      if (data === '\x0c') {
        term.clear();
        prompt();
        term.write(commandBuffer);
        return;
      }

      // Ctrl+U (clear line)
      if (data === '\x15') {
        term.write('\r\x1b[K');
        prompt();
        commandBuffer = '';
        return;
      }

      // Arrow keys (escape sequences)
      if (data.startsWith('\x1b[')) {
        // Up arrow
        if (data === '\x1b[A') {
          if (historyIndex > 0) {
            historyIndex--;
            // Clear current line
            term.write('\r\x1b[K');
            prompt();
            commandBuffer = commandHistory[historyIndex];
            term.write(commandBuffer);
          }
          return;
        }

        // Down arrow
        if (data === '\x1b[B') {
          if (historyIndex < commandHistory.length - 1) {
            historyIndex++;
            term.write('\r\x1b[K');
            prompt();
            commandBuffer = commandHistory[historyIndex];
            term.write(commandBuffer);
          } else if (historyIndex === commandHistory.length - 1) {
            historyIndex = commandHistory.length;
            term.write('\r\x1b[K');
            prompt();
            commandBuffer = currentLine;
            term.write(commandBuffer);
          }
          return;
        }

        // Ignore other escape sequences for now
        return;
      }

      // Regular character - only printable ASCII
      if (code >= 32 && code < 127) {
        commandBuffer += data;
        term.write(data);
      }
    });

    // Focus terminal on click
    document.getElementById('terminal-container').addEventListener('click', () => {
      term.focus();
    });

    // Initial focus
    term.focus();
  </script>
</body>
</html>
