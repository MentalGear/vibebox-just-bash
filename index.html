<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>just-bash Playground</title>
  <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e94560;
    }

    header p {
      color: #888;
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      min-height: 0;
    }

    #terminal-container {
      flex: 1;
      background: #0f0f23;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
      min-height: 0;
    }

    #terminal {
      width: 100%;
      height: 100%;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #888;
    }

    .status-dot.ready {
      background: #4caf50;
    }

    .status-dot.busy {
      background: #ff9800;
    }

    .help-text {
      color: #666;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.75rem 1rem;
      }

      main {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>just-bash Playground</h1>
    <p>A bash interpreter running entirely in your browser via Web Worker</p>
  </header>

  <main>
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
  </main>

  <div class="status-bar">
    <div class="status-indicator">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Initializing...</span>
    </div>
    <div class="help-text">Type "help" for available commands</div>
  </div>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
